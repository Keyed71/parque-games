<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Fortunes — Host Answer Key</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #fdf6ec; color: #1e293b; padding-bottom: 2rem; }

    .header {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(150deg, #7a2e1a, #c4592a, #d4845a);
      color: #fff; padding: 0.9rem 1rem 0.8rem;
      box-shadow: 0 3px 14px rgba(122,46,26,0.25);
    }
    .header h1 { font-size: 1.2rem; font-weight: 900; }
    .warn { font-size: 0.78rem; font-weight: 700; opacity: 0.95; margin-top: 0.15rem; }
    .search {
      width: 100%; margin-top: 0.65rem; padding: 0.6rem 0.9rem;
      border: none; border-radius: 12px; font-family: 'Nunito', sans-serif;
      font-size: 1rem; font-weight: 700; color: #1e293b;
    }
    .search::placeholder { color: #94a3b8; font-weight: 600; }

    .wrap { max-width: 560px; margin: 0 auto; padding: 0.9rem 0.8rem 0; }
    .count { font-size: 0.78rem; font-weight: 700; color: #94a3b8; margin: 0.2rem 0.3rem 0.8rem; }

    .card {
      background: #fff; border: 2px solid #e8d0b0; border-radius: 16px;
      margin-bottom: 0.9rem; overflow: hidden; box-shadow: 0 4px 14px rgba(122,46,26,0.07);
    }
    .q-prompt {
      background: #fff5ed; padding: 0.7rem 1rem; font-size: 1rem; font-weight: 900; color: #7a2e1a;
      border-bottom: 2px solid #f0dcc4; line-height: 1.3;
    }
    .q-prompt .pre { display: block; font-size: 0.68rem; font-weight: 800; color: #c4592a; text-transform: uppercase; letter-spacing: 0.07em; }
    .ans-row {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 1rem;
      border-bottom: 1px solid #f5ece0; font-size: 1.05rem; font-weight: 800;
    }
    .ans-row:last-child { border-bottom: none; }
    .ans-row.hit { background: #fef3c7; }
    .a-rank {
      width: 1.9rem; height: 1.9rem; flex-shrink: 0; border-radius: 50%;
      background: #1e3a5f; color: #fbbf24; font-weight: 900; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .a-text { flex: 1; }
    .a-pts {
      min-width: 2.2rem; text-align: center; font-weight: 900; color: #15803d;
      background: #f0fdf4; border-radius: 8px; padding: 0.1rem 0.5rem;
    }
    .no-results { text-align: center; color: #94a3b8; font-weight: 700; padding: 2rem 1rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 Family Fortunes — Answer Key</h1>
    <div class="warn">⚠️ Host only — keep this on your phone, don't project it.</div>
    <input class="search" id="search" type="search" placeholder="Search a guess or question…" autocomplete="off">
  </div>
  <div class="wrap">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>

  <script src="/games/family-fortunes-questions.js"></script>
  <script>
    const QUESTIONS = window.FF_QUESTIONS || [];
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const searchEl = document.getElementById('search');

    function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

    function render(query) {
      const q = (query || '').trim().toLowerCase();
      let shown = 0;
      const html = QUESTIONS.map(item => {
        const promptHit = item.prompt.toLowerCase().includes(q);
        const rows = item.answers.map(([text, pts], i) => {
          const hit = q && !promptHit && text.toLowerCase().includes(q);
          return { text, pts, rank: i + 1, hit };
        });
        const anyAnswerHit = rows.some(r => r.hit);
        if (q && !promptHit && !anyAnswerHit) return '';
        shown++;
        const rowsHtml = rows.map(r =>
          `<div class="ans-row${r.hit ? ' hit' : ''}">
            <span class="a-rank">${r.rank}</span>
            <span class="a-text">${esc(r.text)}</span>
            <span class="a-pts">${r.pts}</span>
          </div>`).join('');
        return `<div class="card">
          <div class="q-prompt"><span class="pre">We asked 100 people…</span>${esc(item.prompt)}</div>
          ${rowsHtml}
        </div>`;
      }).join('');

      listEl.innerHTML = html || '<div class="no-results">No answer or question matches that.</div>';
      countEl.textContent = q
        ? `${shown} result${shown !== 1 ? 's' : ''} for “${query.trim()}”`
        : `${QUESTIONS.length} questions · tap the search box to find a guess fast`;
    }

    searchEl.addEventListener('input', e => render(e.target.value));
    render('');
  </script>
</body>
</html>
